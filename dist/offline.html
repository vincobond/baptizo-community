<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Paused | Baptizo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --muted: #a1a1aa;
            --primary: #0ea5e9;
            --accent: #f59e0b;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8fafc;
                --text: #0f172a;
                --muted: #64748b;
                --primary: #0284c7;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
        }

        .container {
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        .logo-container {
            margin-bottom: 2.5rem;
            animation: pulse 4s ease-in-out infinite;
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(14, 165, 233, 0.3));
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .quote {
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.6;
            color: var(--muted);
            margin-bottom: 3rem;
            font-style: italic;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: white;
            padding: 1rem 2rem;
            border-radius: 100px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.4);
        }

        .btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(14, 165, 233, 0.6);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Abstract Background Elements */
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        .wifi-icon {
            margin-bottom: 1.5rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    
    <div class="container">
        <div class="logo-container">
            <img src="https://ik.imagekit.io/h3qzmviwv/baptizo/posts/images/Baptizo-logo.png" alt="Baptizo Logo" class="logo">
        </div>

        <div class="wifi-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 19.18a1 1 0 0 1-1.42 0L5.27 15.15a1 1 0 0 1 0-1.42 10.94 10.94 0 0 1 13.46 0 1 1 0 0 1 0 1.42l-4.02 4.03a1 1 0 0 1-1.42 0l-1.42-1.42a1 1 0 0 1 0-1.42"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
        </div>

        <h1>Connection Paused</h1>
        
        <p class="quote">
            "The Great Silence is a portal to Deep Wisdom. <br>
            Your connection to the digital world is paused, <br>
            but the journey within remains open."
        </p>

        <button onclick="window.location.reload()" class="btn">
            Seek Reconnection
        </button>
    </div>

    <script>
        // Check connectivity periodically and reload if online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
